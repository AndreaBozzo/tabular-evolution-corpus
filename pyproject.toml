[project]
name = "tabular-evolution-corpus"
version = "0.2.0"
description = "Small, deterministic Parquet fixtures of tabular datasets changing over time, with machine-checked manifests."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=18",
    "jsonschema>=4.21",
]

keywords = ["schema-evolution", "parquet", "arrow", "test-fixtures", "data-engineering"]

[project.urls]
Repository = "https://github.com/AndreaBozzo/tabular-evolution-corpus"
Dataset = "https://huggingface.co/datasets/AndreaBozzo/tabular-evolution-corpus"

[project.scripts]
tec = "tabular_evolution.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.91"]
compat = ["duckdb>=1.1", "polars>=1.10", "pandas>=2.2"]
# Engines driven by adapters/ (not dependencies of the corpus package).
adapters = [
    "dataprof==0.13.0",
    "deltalake==1.6.6",
    "duckdb>=1.1",
    "polars>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # adapters/ lives next to src/, outside the package

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The formatter owns line width; what it cannot wrap is docstring tables and long strings.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Engine imports follow pytest.importorskip, so a missing engine skips instead of failing.
"tests/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pyarrow.int8"]

[tool.ty.environment]
python-version = "3.11"
