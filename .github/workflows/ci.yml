name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: corpus (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag after v7
      - run: uv sync --locked
      - run: uv run pytest
      # Regenerating must reproduce the committed files byte-for-byte on every
      # OS and Python version: uv.lock pins the PyArrow that wrote them.
      - run: uv run python scripts/generate_fixtures.py
      - run: uv run python scripts/build_catalog.py
      - name: regenerated files match the committed ones
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: uv run python scripts/verify_release.py
      - name: checksums verify with standard tools
        if: runner.os == 'Linux'
        run: sha256sum -c SHA256SUMS --quiet

  catalog-readers:
    name: catalog loads in pandas, DuckDB and Polars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag after v7
      - run: uv sync --locked --group compat
      # These tests skip when an engine is missing; here all three must run.
      - name: compat tests pass without skips
        shell: bash
        run: |
          uv run pytest tests/test_catalog_compat.py -q | tee pytest.out
          grep -Eq "^3 passed" pytest.out

  adapters:
    name: adapters run every engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag after v7
      - run: uv sync --locked --group adapters
      # Adapter tests skip when an engine is missing; here every engine must run
      # and the committed results must reproduce with the locked versions.
      - name: adapter tests pass without skips
        shell: bash
        run: |
          uv run pytest tests/test_adapters.py tests/test_report.py -q | tee pytest.out
          grep -Eq "^[0-9]+ passed in " pytest.out
